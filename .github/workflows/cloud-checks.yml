name: Cloud backend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [maverick/gemini-cloud]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
        env:
          VITE_BACKEND: cloud
      - name: Run tests
        run: npm test
